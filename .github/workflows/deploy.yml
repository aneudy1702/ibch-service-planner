name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_D1_DATABASE_NAME: ibch-service-planner
      WRANGLER_VERSION: 4.136.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run tests
        run: npm test

      - name: Ensure Cloudflare D1 database exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if npx --yes wrangler@${WRANGLER_VERSION} d1 info "${CLOUDFLARE_D1_DATABASE_NAME}" >/tmp/wrangler-d1-info.log 2>&1; then
            echo "Cloudflare D1 database ${CLOUDFLARE_D1_DATABASE_NAME} already exists."
            exit 0
          fi

          if grep -q "Couldn't find a D1 DB named" /tmp/wrangler-d1-info.log; then
            echo "Cloudflare D1 database ${CLOUDFLARE_D1_DATABASE_NAME} does not exist yet. Creating it now."
            npx --yes wrangler@${WRANGLER_VERSION} d1 create "${CLOUDFLARE_D1_DATABASE_NAME}"
            exit 0
          fi

          cat /tmp/wrangler-d1-info.log
          exit 1

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply "${CLOUDFLARE_D1_DATABASE_NAME}" --remote

      - name: Deploy to Cloudflare Pages
        id: cloudflare-pages-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=ibch-service-planner

      - name: Deployment summary
        run: echo "Cloudflare Pages deployment finished. Review the deploy step logs for the generated pages.dev URL."
