name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_D1_DATABASE_NAME: ibch-service-planner
      WRANGLER_VERSION: 4.136.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run tests
        run: npm test

      - name: Verify configured Cloudflare D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} d1 info "${CLOUDFLARE_D1_DATABASE_NAME}" --json > /tmp/wrangler-d1-info.json
          node scripts/verify-d1-config.js /tmp/wrangler-d1-info.json wrangler.toml

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@${WRANGLER_VERSION} d1 migrations apply "${CLOUDFLARE_D1_DATABASE_NAME}" --remote

      - name: Deploy to Cloudflare Pages
        id: cloudflare-pages-deploy
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy

      - name: Verify deployed people API
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare-pages-deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "${DEPLOYMENT_URL}"
          npm run healthcheck -- "${DEPLOYMENT_URL%/}/api/people"

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare-pages-deploy.outputs.deployment-url }}
        run: echo "Cloudflare Pages deployment and people API health check succeeded at ${DEPLOYMENT_URL}."
